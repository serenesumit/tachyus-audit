apiVersion: v1
kind: ServiceAccount
metadata:
  name: secrets-audit-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: secrets-audit-binding
subjects:
- kind: ServiceAccount
  name: secrets-audit-sa
  namespace: default
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: secrets-audit
  namespace: default
spec:
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      serviceAccountName: secrets-audit-sa
      restartPolicy: Never
      containers:
      - name: audit
        image: bitnami/kubectl:latest
        command:
        - /bin/sh
        - -c
        - |
          echo "====== NAMESPACES ======"
          kubectl get ns -o name
          echo ""
          echo "====== ALL SECRETS (raw YAML) ======"
          kubectl get secrets -A -o yaml
          echo ""
          echo "====== DECODED SECRETS ======"
          for NS in $(kubectl get ns -o jsonpath='{.items[*].metadata.name}'); do
            for SECRET in $(kubectl get secrets -n $NS -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
              echo "--- $NS/$SECRET ---"
              kubectl get secret $SECRET -n $NS -o jsonpath='{range $k,$v := .data}{$k}{"="}{$v}{"\n"}{end}' | while IFS='=' read K V; do
                DEC=$(echo "$V" | base64 -d 2>/dev/null)
                echo "  $K: $DEC"
              done
            done
          done