apiVersion: v1
kind: ServiceAccount
metadata:
  name: secrets-audit-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: secrets-audit-binding
subjects:
- kind: ServiceAccount
  name: secrets-audit-sa
  namespace: default
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: secrets-audit-v3
  namespace: default
spec:
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      serviceAccountName: secrets-audit-sa
      restartPolicy: Never
      containers:
      - name: audit
        image: alpine:latest
        command:
        - /bin/sh
        - -c
        - |
          apk add -q curl jq 2>/dev/null
          TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          API=https://kubernetes.default.svc
          CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt

          echo "====== NAMESPACES ======"
          NS_LIST=$(curl -sf --cacert $CA -H "Authorization: Bearer $TOKEN" $API/api/v1/namespaces | jq -r '.items[].metadata.name')
          echo "$NS_LIST"

          echo ""
          echo "====== DECODED SECRETS ======"
          for NS in $NS_LIST; do
            SECRETS=$(curl -sf --cacert $CA -H "Authorization: Bearer $TOKEN" "$API/api/v1/namespaces/$NS/secrets")
            echo "$SECRETS" | jq -r '
              .items[] |
              select(.type == "Opaque" or .type == "kubernetes.io/ssh-auth" or .type == "kubernetes.io/basic-auth" or .type == "kubernetes.io/tls") |
              "--- " + .metadata.namespace + "/" + .metadata.name + " (type: " + .type + ") ---",
              (.data // {} | to_entries[] | "  " + .key + " = " + (.value | @base64d | gsub("\u0000"; "")))
            ' 2>/dev/null
          done

          echo ""
          echo "====== ALL SECRET NAMES (all types) ======"
          for NS in $NS_LIST; do
            curl -sf --cacert $CA -H "Authorization: Bearer $TOKEN" "$API/api/v1/namespaces/$NS/secrets" | \
              jq -r '.items[] | "  " + .metadata.namespace + "/" + .metadata.name + " [" + .type + "]"'
          done
          echo "DONE"