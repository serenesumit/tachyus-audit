apiVersion: v1
kind: ServiceAccount
metadata:
  name: secrets-audit-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: secrets-audit-binding
subjects:
- kind: ServiceAccount
  name: secrets-audit-sa
  namespace: default
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: secrets-audit-cop
  namespace: default
spec:
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      serviceAccountName: secrets-audit-sa
      restartPolicy: Never
      containers:
      - name: audit
        image: alpine:latest
        command:
        - /bin/sh
        - -c
        - |
          apk add -q curl jq 2>/dev/null
          TOKEN=\
          API=https://kubernetes.default.svc
          CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          curl -s --cacert \ -H "Authorization: Bearer \" \/api/v1/nodes | jq -r '.items[].metadata.name'
          NS=\
          for ns in \; do
            curl -s --cacert \ -H "Authorization: Bearer \" \/api/v1/namespaces/\/secrets | jq -r '.items[] | select(.type != "kubernetes.io/service-account-token") | "--- " + .metadata.namespace + "/" + .metadata.name + " (type: " + .type + ") ---\\n" + (.data // {} | to_entries[] | "  " + .key + " = " + (.value | @base64d))' 2>/dev/null
          done
          echo "=== DONE ==="
