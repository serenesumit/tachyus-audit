apiVersion: batch/v1
kind: Job
metadata:
  name: dune-img-v2
  namespace: default
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: n8n-audit-sa
      restartPolicy: Never
      containers:
      - name: audit
        image: alpine/curl:latest
        command: ["/bin/sh","-c"]
        args:
        - |
          apk add -q jq
          KUBE_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          API="https://kubernetes.default.svc"
          CA="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          
          # Get GCR credentials
          GCR_SECRET=$(curl -sk --cacert $CA -H "Authorization: Bearer $KUBE_TOKEN" \
            "$API/api/v1/namespaces/dune-api/secrets/gcr-secret")
          DOCKER_CONFIG=$(echo "$GCR_SECRET" | jq -r '.data[".dockerconfigjson"]' | base64 -d)
          
          # Extract auth - try all keys
          echo "Docker auth keys:"
          echo "$DOCKER_CONFIG" | jq -r '.auths | keys[]'
          
          # Get the auth value for the first key that contains "docker.pkg.dev"
          GCR_AUTH=$(echo "$DOCKER_CONFIG" | jq -r '.auths | to_entries[] | select(.key | contains("docker.pkg.dev")) | .value.auth' | head -1)
          echo "GCR auth type: $(echo "$GCR_AUTH" | base64 -d | cut -d: -f1)"
          
          REGISTRY="us-central1-docker.pkg.dev"
          REPO="tachyusbdaas/tachyusbdaas/dune-api/tc-co-prod"
          TAG="v0.0.39-alpha.9"
          
          # Get manifest using Bearer token approach (GCR uses OAuth)
          echo "=GET_TOKEN="
          TOKEN_RESP=$(curl -s -u "$(echo "$GCR_AUTH" | base64 -d)" \
            "https://${REGISTRY}/v2/token?service=${REGISTRY}&scope=repository:tachyusbdaas/tachyusbdaas/dune-api/tc-co-prod:pull")
          echo "$TOKEN_RESP" | jq '{token_len:(.token|length), error:.error}'
          BEARER=$(echo "$TOKEN_RESP" | jq -r '.token')
          echo "=END_TOKEN="
          
          echo "=GET_MANIFEST="
          MANIFEST=$(curl -sv -H "Authorization: Bearer $BEARER" \
            -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
            "https://${REGISTRY}/v2/${REPO}/manifests/${TAG}" 2>&1)
          echo "$MANIFEST" | tail -5
          MANIFEST_JSON=$(curl -s -H "Authorization: Bearer $BEARER" \
            -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
            "https://${REGISTRY}/v2/${REPO}/manifests/${TAG}")
          CONFIG_DIGEST=$(echo "$MANIFEST_JSON" | jq -r '.config.digest')
          echo "Config digest: $CONFIG_DIGEST"
          echo "=END_MANIFEST="
          
          if [ "$CONFIG_DIGEST" != "null" ] && [ -n "$CONFIG_DIGEST" ]; then
            echo "=IMAGE_CONFIG="
            curl -s -H "Authorization: Bearer $BEARER" \
              "https://${REGISTRY}/v2/${REPO}/blobs/${CONFIG_DIGEST}" | jq '.config | {Env:.Env, Cmd:.Cmd, Entrypoint:.Entrypoint, WorkingDir:.WorkingDir, Labels:.Labels}'
            echo "=END_CONFIG="
          fi