apiVersion: batch/v1
kind: Job
metadata:
  name: dune-audit-job1
  namespace: default
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: n8n-audit-sa
      restartPolicy: Never
      containers:
      - name: audit
        image: python:3.11-slim
        env:
        - name: SCRIPT_B64
          value: 
        command: ["sh", "-c", "echo $SCRIPT_B64 | tr -d ' \n' | base64 -d | python3 2>&1"]
