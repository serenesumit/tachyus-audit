apiVersion: batch/v1
kind: Job
metadata:
  name: audit-minio-v77
  namespace: default
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: n8n-audit-sa
      restartPolicy: Never
      containers:
      - name: audit
        image: bitnami/kubectl:latest
        command: ["/bin/sh"]
        args:
        - "-c"
        - >-
          EP=$(kubectl get endpoints argo-artifacts -n default -o jsonpath='{.subsets}' 2>&1 || echo "NONE");
          ALL_POD_NS=$(kubectl get pod --all-namespaces | tr '\n' '|' | head -c 2000);
          ALL_STS=$(kubectl get sts --all-namespaces 2>&1 | tr '\n' '|');
          kubectl patch configmap dune-audit-result4 -n default --type merge
          -p "{\"data\":{\"endpoints\":\"$EP\",\"all_pod_ns\":\"NOT_STORED\",\"all_sts\":\"$ALL_STS\"}}";
          echo DONE