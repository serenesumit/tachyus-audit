apiVersion: batch/v1
kind: Job
metadata:
  name: dune-db-v2
  namespace: default
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: n8n-audit-sa
      restartPolicy: Never
      containers:
      - name: audit
        image: alpine/curl:latest
        command: ["/bin/sh","-c"]
        args:
        - |
          apk add -q postgresql-client jq
          export PGPASSWORD=wpEJl3WKOImARD9WgBsa
          PG="psql -h 172.16.10.14 -p 6432 -U postgres"
          
          echo "=DUNE_DBS="
          $PG -tc "SELECT datname FROM pg_database WHERE datname ILIKE '%dune%' OR datname ILIKE '%bdaas%';"
          echo "=END="
          
          echo "=ALL_DBS="
          $PG -tc "SELECT datname FROM pg_database ORDER BY datname;"
          echo "=END_ALL="