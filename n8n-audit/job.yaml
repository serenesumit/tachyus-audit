apiVersion: batch/v1
kind: Job
metadata:
  name: audit-v57
  namespace: default
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: n8n-audit-sa
      restartPolicy: Never
      containers:
      - name: auditor
        image: bitnami/kubectl:latest
        command: ["/bin/sh","-c"]
        args:
        - |
          POD=$(kubectl get pods -n dune-api -l app=dune-api -o jsonpath='{.items[0].metadata.name}')
          echo "POD=$POD"
          PYCODE=""
          RAW=$(kubectl exec -n dune-api $POD -- python3 -c "import base64,sys; exec(base64.b64decode('$PYCODE').decode())" 2>&1)
          ENCODED=$(echo "$RAW" | base64 -w0)
          kubectl patch configmap dune-audit-result4 -n default --type merge -p "{\"data\":{\"v57_result\":\"$ENCODED\"}}"
          echo "PATCHED"