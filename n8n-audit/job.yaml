apiVersion: batch/v1
kind: Job
metadata:
  name: n8n-diag
  namespace: default
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 0
  template:
    spec:
      serviceAccountName: n8n-audit-sa
      restartPolicy: Never
      containers:
      - name: scan
        image: python:3.11-slim
        command: ["/bin/sh", "-c"]
        args: ["apt-get install -y kubectl 2>/dev/null; curl -LO 'https://dl.k8s.io/release/v1.28.0/bin/linux/amd64/kubectl' 2>/dev/null && chmod +x kubectl && mv kubectl /usr/local/bin/kubectl; echo $SCRIPT_B64 | base64 -d | python3 2>&1"]
        env:
        - name: SCRIPT_B64
          value: ""
