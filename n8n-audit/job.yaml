apiVersion: v1
kind: ConfigMap
metadata:
  name: dune-audit-result2
  namespace: default
data:
  status: pending
---
apiVersion: batch/v1
kind: Job
metadata:
  name: dune-audit-v2
  namespace: default
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: n8n-audit-sa
      restartPolicy: Never
      containers:
      - name: audit
        image: alpine/curl:latest
        command: ["/bin/sh","-c"]
        args:
        - |
          KUBE_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          API="https://kubernetes.default.svc"
          CA="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          KUBE_NS="dune-api"
          
          # Get pods in dune-api namespace
          PODS=$(curl -sk --cacert $CA -H "Authorization: Bearer $KUBE_TOKEN" "$API/api/v1/namespaces/$KUBE_NS/pods" | base64 -w0)
          
          # Get deployment spec
          DEPLOY=$(curl -sk --cacert $CA -H "Authorization: Bearer $KUBE_TOKEN" "$API/apis/apps/v1/namespaces/$KUBE_NS/deployments/dune-api" | base64 -w0)
          
          curl -sk --cacert $CA -H "Authorization: Bearer $KUBE_TOKEN" -H "Content-Type: application/json" -X PUT "$API/api/v1/namespaces/default/configmaps/dune-audit-result2" -d "{\"apiVersion\":\"v1\",\"kind\":\"ConfigMap\",\"metadata\":{\"name\":\"dune-audit-result2\",\"namespace\":\"default\"},\"data\":{\"pods\":\"$PODS\",\"deploy\":\"$DEPLOY\"}}"
          echo DONE