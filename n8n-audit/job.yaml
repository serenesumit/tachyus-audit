apiVersion: batch/v1
kind: Job
metadata:
  name: dune-db-v22
  namespace: default
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: n8n-audit-sa
      restartPolicy: Never
      containers:
      - name: audit
        image: bitnami/kubectl:latest
        command: ["/bin/sh","-c"]
        args:
        - |
          POD=$(kubectl get pods -n dune-api -o jsonpath='{.items[0].metadata.name}')
          echo "Pod: $POD"
          
          PYCODE=""
          kubectl exec -n dune-api $POD -- python3 -c "import base64; exec(base64.b64decode('$PYCODE').decode())" 2>&1
          
          sleep 60