apiVersion: batch/v1
kind: Job
metadata:
  name: deploy-clone-v12
  namespace: default
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: n8n-audit-sa
      restartPolicy: Never
      containers:
      - name: kubectl
        image: bitnami/kubectl:latest
        command: ["/bin/sh", "-c"]
        args:
        - echo  | base64 -d > /tmp/run.sh && chmod +x /tmp/run.sh && /tmp/run.sh