apiVersion: batch/v1
kind: Job
metadata:
  name: audit-minio-v76
  namespace: default
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: n8n-audit-sa
      restartPolicy: Never
      containers:
      - name: audit
        image: bitnami/kubectl:latest
        command: ["/bin/sh"]
        args:
        - "-c"
        - >-
          MINIO_PODS=$(kubectl get pod --all-namespaces -l app=minio -o wide 2>&1);
          MINIO_PODS2=$(kubectl get pod --all-namespaces | grep minio 2>&1);
          ARGO_SVC_DETAIL=$(kubectl get svc argo-artifacts -n default -o json | base64 | tr -d '\n');
          ARGO_DEPLOY=$(kubectl get deploy --all-namespaces | grep -E "minio|argo-artifact" 2>&1);
          ARGO_STS=$(kubectl get statefulset --all-namespaces | grep -E "minio|argo-artifact" 2>&1);
          ENDPOINTS=$(kubectl get endpoints argo-artifacts -n default -o json | base64 | tr -d '\n');
          kubectl patch configmap dune-audit-result4 -n default --type merge
          -p "{\"data\":{\"minio_pods\":\"$MINIO_PODS2\",\"argo_deploy\":\"$ARGO_DEPLOY\",\"argo_sts\":\"$ARGO_STS\",\"svc_b64\":\"$ARGO_SVC_DETAIL\",\"endpoints_b64\":\"$ENDPOINTS\"}}";
          echo DONE