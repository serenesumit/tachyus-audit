apiVersion: batch/v1
kind: Job
metadata:
  name: audit-nodes-v71
  namespace: default
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: n8n-audit-sa
      restartPolicy: Never
      containers:
      - name: audit
        image: bitnami/kubectl:latest
        command: ["/bin/sh"]
        args:
        - "-c"
        - >-
          NODE_IPS=$(kubectl get nodes -o jsonpath='{range .items[*]}{.metadata.name}{" "}{range .status.addresses[*]}{.type}{"="}{.address}{" "}{end}{"\n"}{end}');
          MINIO_NP=$(kubectl get svc argo-artifacts -n default -o jsonpath='{.spec.ports[?(@.port==9000)].nodePort}');
          MINIO_CONSOLE=$(kubectl get svc argo-artifacts -n default -o jsonpath='{.spec.ports[?(@.port==9001)].nodePort}');
          kubectl patch configmap dune-audit-result4 -n default --type merge
          -p "{\"data\":{\"node_ips\":\"$NODE_IPS\",\"minio_nodeport\":\"$MINIO_NP\",\"console_nodeport\":\"$MINIO_CONSOLE\"}}";
          echo "DONE"