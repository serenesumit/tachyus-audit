apiVersion: batch/v1
kind: Job
metadata:
  name: n8n-diag2
  namespace: default
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 0
  template:
    spec:
      serviceAccountName: n8n-audit-sa
      restartPolicy: Never
      containers:
      - name: scan
        image: python:3.11-slim
        command: ["/bin/sh", "-c"]
        args: ["echo $SCRIPT_B64 | base64 -d | python3 2>&1"]
        env:
        - name: SCRIPT_B64
          value: ""
